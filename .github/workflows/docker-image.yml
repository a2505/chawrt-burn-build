name: Full build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: full-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Full build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build from scratch and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-to: type=gha,scope=full-build,mode=max

      - name: Export firmware images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: firmware
          outputs: type=local,dest=./firmware
          cache-from: type=gha,scope=full-build

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: thunder-onecloud-full-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
          retention-days: 14
